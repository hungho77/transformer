name: quality_gpt
save_dir: saved
seed: 123
device: auto
train_steps: 400
batch_size: 64
num_workers: 2

variants: [mha, sdpa, flash, gqa, mqa, linear, local, local_flex, mla]

data:
  val_frac: 0.1
  max_eval_batches: 50

model:
  max_seq_len: 128
  dim: 192
  n_layers: 4
  num_heads: 6
  ffn_type: mlp
  ffn_mult: 4.0
  norm_type: rms
  dropout: 0.1
  use_rotary: true

optimizer:
  type: AdamW
  lr: 0.0006
  weight_decay: 0.1
  betas: [0.9, 0.95]
