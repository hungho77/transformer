[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformerlab"
version = "0.1.0"
description = "From-scratch transformer architectures with pluggable, benchmarkable attention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.2",
    "torchvision",
    "numpy",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
flash = ["flash-attn"]
dev = ["pytest", "flake8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transformerlab = ["py.typed"]
